name: traveling-ruby
description: Traveling Ruby at your fingertips
inputs:
  ruby-version:
    description: 'Ruby version to install (e.g. 3.4.12), defaults to the newest'
    required: false
    default: ''
  revision:
    description: 'Package revision of the Ruby version (e.g. 0), defaults to the newest'
    required: false
    default: ''
  gems:
    description: 'List of gems and optionally versions, white space seperated (e.g. "nokogiri-1.18.10 rails")'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - run: '"$GITHUB_ACTION_PATH/cli.sh" --ci'
      shell: bash
      env:
        TRAVELING_RUBY_VERSION: ${{ inputs.ruby-version }}
        TRAVELING_RUBY_REVISION: ${{ inputs.revision }}
        TRAVELING_RUBY_GEM_LIST: ${{ inputs.gems }}
