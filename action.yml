name: traveling-ruby
description: Traveling Ruby at your fingertips
inputs:
  ruby-version:
    description: 'Ruby version to install, defaults to the first version built by the release'
    required: false
    default: ''
  release:
    description: 'Release date of the package to install (e.g. 20261102), defaults to the latest release'
    required: false
    default: ''
  gems:
    description: 'List of gems and optionally versions, white space seperated (e.g. "nokogiri-1.18.10 rails")'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - run: '"$GITHUB_ACTION_PATH/cli.sh" --ci'
      shell: bash
      env:
        TRAVELING_RUBY_VERSION: ${{ inputs.ruby-version }}
        TRAVELING_RUBY_PKG_DATE: ${{ inputs.release }}
        TRAVELING_RUBY_GEM_LIST: ${{ inputs.gems }}
