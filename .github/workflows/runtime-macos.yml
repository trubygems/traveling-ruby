name: macOS runtime

# Sets up the macOS runtime (the build tools and libraries Ruby and the gems
# link against). Each unit of it (one per recipe in macos/deps) is stored in the
# container registry under a key that macos/setup-runtime.sh computes from the
# unit's recipe, the toolchain and the units it is built against, so a change to
# one recipe rebuilds only that unit and the units that depend on it. The build
# jobs then pull every unit from the registry.
#
# Pull requests from forks can't push to the registry, so they get the runtime
# as a workflow artifact instead.

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      rebuild:
        description: 'Build every unit of the runtime instead of pulling it from the registry'
        required: false
        default: false
        type: boolean
    outputs:
      source:
        description: 'Where the build jobs get the runtime: registry or artifact'
        value: ${{ jobs.runtime.outputs.source }}
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architectures to build'
        required: true
        default: all
        type: choice
        options: [ all, x86_64, arm64 ]
      rebuild:
        description: 'Build every unit of the runtime instead of pulling it from the registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  RUNTIME_REPO: ${{ vars.MACOS_RUNTIME_REPO || format('ghcr.io/{0}-runtime', github.repository) }}

jobs:
  runtime:
    name: macos ${{ matrix.arch }} runtime
    strategy:
      matrix:
        arch: ${{ inputs.arch == 'all' && fromJSON('["x86_64", "arm64"]') || fromJSON(format('["{0}"]', inputs.arch)) }}
      fail-fast: false
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    env:
      ARCHITECTURES: ${{ matrix.arch }}
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      source: ${{ steps.result.outputs.source }}
    steps:
      - uses: actions/checkout@v5

      - uses: oras-project/setup-oras@v1

      - name: Log in to the registry
        run: echo "${{ github.token }}" | oras login "${RUNTIME_REPO%%/*}" -u "${{ github.actor }}" --password-stdin

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: macos/cache
          key: macos-sources-${{ hashFiles('macos/deps/*.sh') }}
          restore-keys: macos-sources-

      - name: Set up runtime
        working-directory: macos
        env:
          RUNTIME_PULL: ${{ !inputs.rebuild }}
          RUNTIME_PUSH: ${{ env.CAN_PUSH }}
        run: |
          rake stash_conflicting_paths
          rake runtime
          rake unstash_conflicting_paths

      - name: Pack runtime
        if: env.CAN_PUSH != 'true'
        run: tar -C macos -czf runtime.tar.gz --exclude 'runtime/ccache/*' --exclude 'runtime/ruby-*.tar.gz' runtime

      - uses: actions/upload-artifact@v5
        if: env.CAN_PUSH != 'true'
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: runtime.tar.gz
          retention-days: 1

      - name: Result
        id: result
        run: echo "source=${{ env.CAN_PUSH == 'true' && 'registry' || 'artifact' }}" >> "$GITHUB_OUTPUT"
