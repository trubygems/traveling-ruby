name: Build

# Builds every platform on pushes to main and pull requests. Pull requests build
# every platform too, unless they carry "build:<platform>" labels, which limit
# the build to those platforms. Run it by hand to build chosen platforms and
# Ruby versions.
#
# Ruby versions come from versions/RUBY_VERSIONS.txt and their revisions from
# versions/RUBY_REVISIONS.txt. Pushes to main (and runs by hand with "publish")
# publish to one release per Ruby version, revision and target, e.g.
# ruby-3.4.12-0-linux-x86_64: the first publish creates it, later ones only add
# packages it lacks, such as new gem versions. Bump a version's revision to
# rebuild and release its runtime afresh.

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'doc/**' ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
    paths-ignore: [ '**.md', 'docs/**', 'doc/**' ]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: all, or any of linux linux-musl macos windows windows-via-unix'
        required: false
        default: all
        type: string
      ruby_versions:
        description: 'Ruby versions to build: all, or any of versions/RUBY_VERSIONS.txt'
        required: false
        default: all
        type: string
      publish:
        description: 'Publish the packages to their releases'
        required: false
        default: false
        type: boolean
      rebuild_runtime:
        description: 'Rebuild the macOS runtime even if the registry has it'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.setup.outputs.revisions }}
      publish: ${{ env.PUBLISH }}
      ruby-versions: ${{ steps.setup.outputs.ruby-versions }}
      ruby-versions-arm64: ${{ steps.setup.outputs.ruby-versions-arm64 }}
      windows-via-unix-builds: ${{ steps.setup.outputs.windows-via-unix-builds }}
      newest-ruby-version: ${{ steps.setup.outputs.newest-ruby-version }}
      latest-ruby-version: ${{ steps.setup.outputs.latest-ruby-version }}
      linux: ${{ steps.setup.outputs.linux }}
      linux-musl: ${{ steps.setup.outputs.linux-musl }}
      macos: ${{ steps.setup.outputs.macos }}
      windows: ${{ steps.setup.outputs.windows }}
      windows-via-unix: ${{ steps.setup.outputs.windows-via-unix }}
    steps:
      - uses: actions/checkout@v5
      - id: setup
        run: ./scripts/ci-setup.sh && cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          RUBY_VERSIONS: ${{ inputs.ruby_versions }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  linux:
    needs: setup
    if: needs.setup.outputs.linux == 'true'
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
      fail-fast: false
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux
      arch: ${{ matrix.arch }}
      ruby-versions: ${{ needs.setup.outputs.ruby-versions }}

  linux-musl:
    needs: setup
    if: needs.setup.outputs.linux-musl == 'true'
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
      fail-fast: false
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-musl
      arch: ${{ matrix.arch }}
      ruby-versions: ${{ needs.setup.outputs.ruby-versions }}

  macos:
    needs: setup
    if: needs.setup.outputs.macos == 'true'
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
      fail-fast: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: ${{ matrix.arch }}
      ruby-versions: ${{ needs.setup.outputs.ruby-versions }}
      rebuild-runtime: ${{ inputs.rebuild_runtime == true }}

  windows:
    needs: setup
    if: needs.setup.outputs.windows == 'true'
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
      fail-fast: false
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: ${{ matrix.arch }}
      revisions: ${{ needs.setup.outputs.revisions }}
      # RubyInstaller ships arm64 builds from Ruby 3.4
      ruby-versions: ${{ matrix.arch == 'arm64' && needs.setup.outputs.ruby-versions-arm64 || needs.setup.outputs.ruby-versions }}
      newest-ruby-version: ${{ needs.setup.outputs.newest-ruby-version }}

  # Cross-builds the Windows packages on macOS. These lack the DLLs that the
  # native extensions need, so they are tested but never released.
  windows-via-unix:
    needs: setup
    if: needs.setup.outputs.windows-via-unix == 'true'
    uses: ./.github/workflows/build-windows-via-unix.yml
    with:
      revisions: ${{ needs.setup.outputs.revisions }}
      builds: ${{ needs.setup.outputs.windows-via-unix-builds }}
      ruby-versions: ${{ needs.setup.outputs.ruby-versions }}
      newest-ruby-version: ${{ needs.setup.outputs.newest-ruby-version }}

  publish:
    needs: [ setup, linux, linux-musl, macos, windows ]
    if: ${{ !cancelled() && needs.setup.outputs.publish == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      # One checksums file per platform: an attestation takes at most 1024 subjects
      - name: Write checksums
        working-directory: dist
        run: |
          mkdir ../checksums
          for platform in linux linux-musl macos windows; do
            files=$(ls traveling-ruby-*.tar.gz | grep -E -- "-[0-9]+-$platform-(x86_64|arm64)[-.]" || true)
            [ -z "$files" ] || sha256sum $files > ../checksums/$platform
          done
          wc -l ../checksums/*
          [ "$(cat ../checksums/* | wc -l)" -eq "$(ls traveling-ruby-*.tar.gz | wc -l)" ]

      - name: Attest build provenance (linux)
        if: github.server_url == 'https://github.com' && hashFiles('checksums/linux') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: checksums/linux

      - name: Attest build provenance (linux-musl)
        if: github.server_url == 'https://github.com' && hashFiles('checksums/linux-musl') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: checksums/linux-musl

      - name: Attest build provenance (macos)
        if: github.server_url == 'https://github.com' && hashFiles('checksums/macos') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: checksums/macos

      - name: Attest build provenance (windows)
        if: github.server_url == 'https://github.com' && hashFiles('checksums/windows') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: checksums/windows

      - name: Publish to releases
        run: ./scripts/publish-releases.sh dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST_RUBY: ${{ needs.setup.outputs.latest-ruby-version }}
