name: Test traveling-ruby action

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ main ]
  pull_request:
    paths:
      - action.yml
      - cli.sh
      - .github/workflows/test.yml

jobs:
  releases:
    name: check for ruby-* releases
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        # cli.sh and the action download from ruby-<version>-<revision>-<target>
        # releases, which only exist once Build has published from main
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -q '^ruby-'; then
            echo published=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ruby-* releases published yet; skipping install tests until Build publishes from main"
            echo published=false >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    runs-on: ubuntu-latest
    name: test traveling-ruby action on Linux
    steps:
      - name: remove system installed ruby & linuxbrew from Linux
        if: env.ACT != 'true' && runner.os == 'Linux'
        # default act image doesn't contain ruby or linuxbrew
        run : |
          ruby --version
          sudo rm -rf /usr/bin/ruby
          sudo apt-get --purge remove ruby-full
          ruby --version || echo "ruby not found as expected"
          /home/linuxbrew/.linuxbrew/bin/brew --version
          sudo rm -rf /home/linuxbrew

      - uses: actions/checkout@v5

      - id: traveling-ruby-action
        uses: ./
        with:
          gems: rack-3.1.8 rainbow

      - name: bash
        run: |
          ruby --version
          ruby -rrack -e 'abort Rack.release unless Rack.release == "3.1.8"'
          ruby -rrainbow -e 'puts Rainbow("rainbow loaded").green'
        shell: bash

      - name: sh
        run: ruby --version
        shell: sh

  macos:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    runs-on: macos-latest
    name: test traveling-ruby action on macOS
    steps:
      - uses: actions/checkout@v5

      - id: traveling-ruby-action
        uses: ./

      - name: bash
        run: |
          which ruby
          ruby --version
        shell: bash

      - name: sh
        run: ruby --version
        shell: sh

  windows:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    runs-on: windows-latest
    name: test traveling-ruby action on Windows
    steps:
      - uses: actions/checkout@v5
      - id: traveling-ruby-action
        uses: ./

      - name: bash
        run: ruby.bat --version
        shell: bash

      - name: cmd
        run: ruby --version
        shell: cmd

      - name: powershell
        run: ruby --version
        shell: powershell

      - name: pwsh
        run: ruby --version
        shell: pwsh
