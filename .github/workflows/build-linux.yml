name: Build Linux

on:
  workflow_call:
    inputs:
      platform:
        description: 'linux or linux-musl'
        required: true
        type: string
      arch:
        required: true
        type: string
      ruby-versions:
        description: 'JSON array of Ruby versions'
        required: true
        type: string

jobs:
  # Builds the builder image into the Actions cache when its tag is not
  # published yet (a new IMAGE_VERSION), so the build jobs below only load it
  image:
    name: ${{ inputs.platform }} ${{ inputs.arch }} image
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Lets buildx use the Actions cache
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build image
        run: ./scripts/builder-image.sh cache
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}

  build:
    name: ${{ inputs.platform }} ${{ inputs.arch }} ${{ matrix.ruby-version }}
    needs: image
    strategy:
      matrix:
        ruby-version: ${{ fromJSON(inputs.ruby-versions) }}
      fail-fast: false
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    env:
      ARCHITECTURES: ${{ inputs.arch }}
      RUBY_VERSIONS: ${{ matrix.ruby-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - uses: docker/setup-buildx-action@v3

      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Load image
        run: ./scripts/builder-image.sh load
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}

      - name: Build
        working-directory: ${{ inputs.platform }}
        run: |
          rake
          rake package_full

      - name: Package gems
        run: ./scripts/package-gems.sh
        env:
          PLATFORM: ${{ inputs.platform }}

      - uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ inputs.platform }}-${{ inputs.arch }}-${{ matrix.ruby-version }}
          path: ${{ inputs.platform }}/traveling-ruby*.tar.gz

      - name: Test
        working-directory: ${{ inputs.platform }}
        run: rake test_docker
