name: MacOS x86_64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear runtime cache'
        required: false
        default: false
        type: boolean

# Commit message keyword filtering:
# - "(macos-x86_64)" → run this workflow
# - "(macos)" → run this workflow (umbrella for both macos arches)
# - "(windows)", "(linux)", "(linux-musl)" → skip this workflow
# - No keyword → run all (backward compatible)

env:
  PKG_DATE: 20260922
  PLATFORM: macos
  ARCHITECTURES: x86_64

jobs:
  # Builds the runtime only when no cache exists for this Xcode and these
  # runtime inputs; the make jobs restore it from the cache.
  package-runtime:
    if: |
      (contains(github.event.head_commit.message || '', '(macos-x86_64)') ||
       contains(github.event.head_commit.message || '', '(macos)') ||
       !contains(github.event.head_commit.message || '', '('))
    runs-on: macos-15-intel
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate cache key
        id: cache-key
        run: |
          XCODE=$(xcodebuild -version | head -1 | tr ' ' '-')
          KEY="macos-${ARCHITECTURES}-runtime-${XCODE}-${{ hashFiles('macos/setup-runtime.sh', 'macos/internal/bin/**', 'macos/internal/reset_environment.sh', 'macos/internal/check_requirements.sh', 'macos/internal/*.patch', 'shared/library.sh') }}"
          if [ "${{ inputs.clear_cache }}" = "true" ]; then
            KEY="${KEY}-${{ github.run_id }}"
          fi
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "Runtime cache key: ${KEY}"

      - name: Check runtime cache
        id: cache-runtime
        uses: actions/cache/restore@v4
        with:
          path: macos/runtime/
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true

      - name: Build runtime
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          cd macos
          rake stash_conflicting_paths
          rake runtime
          rake unstash_conflicting_paths

      - name: Save runtime cache
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: macos/runtime/
          key: ${{ steps.cache-key.outputs.key }}

  setup-ruby-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.ruby_versions }}
    steps:
      - name: Set Ruby versions
        id: set-versions
        run: |
          echo "ruby_versions=['3.3.13','3.4.12','4.0.7']" >> $GITHUB_OUTPUT

  make-macos-x86_64:
    needs: [ package-runtime, setup-ruby-versions ]
    strategy:
      matrix:
        os: [macos-15-intel]
        ruby-version: ${{ fromJson(needs.setup-ruby-versions.outputs.versions) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: macos/runtime/
          key: ${{ needs.package-runtime.outputs.cache-key }}
          fail-on-cache-miss: true

      # The checkout leaves setup-runtime.sh newer than runtime/ok, which would
      # make rake rebuild the runtime we just restored.
      - name: Mark runtime as up to date
        run: touch macos/runtime/ok

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: macos/runtime/vendor/cache
          key: macos-x86_64-gems-${{ hashFiles('shared/gemfiles/*/Gemfile.lock') }}

      - name: Build x86_64
        run: |
          cd macos
          rake stash_conflicting_paths
          rake --trace
          rake package_full
          rake unstash_conflicting_paths
          ls
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}

      - name: Package gems
        run: ./scripts/package-gems.sh

      - name: 'Upload Artifact- macos x86_64'
        uses: actions/upload-artifact@v5
        with:
          name: traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-macos-x86_64.tar.gz
          path: macos/traveling-ruby*.tar.gz

      - name: Test
        run: |
          cd macos
          rake test
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}

      - name: Publish archives and packages
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: 'Release ${{ github.event.release.tag_name }}'
          generate_release_notes: true
          body: ${{ github.event.release.body }}
          files: macos/traveling-ruby-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
