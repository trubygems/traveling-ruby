name: Builder images

# Builds and pushes the Docker images the Linux builds run in, tagged with
# IMAGE_VERSION from linux/Rakefile or linux-musl/Rakefile. Bump IMAGE_VERSION
# when changing an image, so released packages keep building from the old one.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Images to build'
        required: true
        default: all
        type: choice
        options: [ all, linux, linux-musl ]

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["linux", "linux-musl"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
        arch: [ x86_64, arm64 ]
      fail-fast: false
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Build image
        id: build
        working-directory: ${{ matrix.platform }}
        run: |
          rake image
          tag=$(ruby -e 'puts File.read("Rakefile")[/^IMAGE_VERSION = "(.+)"/, 1]')
          echo "image=you54f/traveling-ruby-builder-$ARCHITECTURES:$tag" | tee -a "$GITHUB_OUTPUT"
        env:
          ARCHITECTURES: ${{ matrix.arch }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push "${{ steps.build.outputs.image }}"
