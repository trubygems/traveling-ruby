name: Builder images

# Builds and pushes the Docker images the Linux builds run in, from image/ (see
# image/docker-bake.hcl), tagged with IMAGE_VERSION from linux/Rakefile or
# linux-musl/Rakefile. Bump IMAGE_VERSION when changing an image, so released
# packages keep building from the old one. Every dependency stage is kept in
# the Actions cache, so changing one recipe only rebuilds that dependency.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Images to build'
        required: true
        default: all
        type: choice
        options: [ all, linux, linux-musl ]

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["linux", "linux-musl"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
        arch: [ x86_64, arm64 ]
      fail-fast: false
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Lets buildx use the Actions cache
      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        working-directory: image
        run: |
          tag=$(sed -n 's/^IMAGE_VERSION = "\(.*\)-.*"$/\1/p' "../$PLATFORM/Rakefile")
          IMAGE_VERSION=$tag docker buildx bake --push \
            --set "*.cache-from=type=gha,scope=$PLATFORM-$ARCH" \
            --set "*.cache-to=type=gha,mode=max,scope=$PLATFORM-$ARCH" \
            "$PLATFORM-$ARCH"
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
