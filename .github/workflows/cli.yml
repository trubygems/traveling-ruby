name: Test cli.sh

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ main ]
  pull_request:
    paths:
      - cli.sh
      - .github/workflows/cli.yml

jobs:
  releases:
    name: check for ruby-* releases
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        # cli.sh and the action download from ruby-<version>-<revision>-<target>
        # releases, which only exist once Build has published from main
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -q '^ruby-'; then
            echo published=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ruby-* releases published yet; skipping install tests until Build publishes from main"
            echo published=false >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  unix:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    name: "${{ matrix.os }} ${{ matrix.shell }} ${{ matrix.args || 'latest' }}"
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        shell: [bash, sh]
        args: ['', '-v 3.3.13 -r 0']
      fail-fast: false
    defaults:
      run:
        shell: ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: remove system installed ruby & linuxbrew from Linux
        if: env.ACT != 'true' && runner.os == 'Linux'
        # default act image doesn't contain ruby or linuxbrew
        run : |
          sudo rm -rf /usr/bin/ruby /home/linuxbrew
          ruby --version || echo "ruby not found as expected"
      - uses: actions/checkout@v5
      - run: ./cli.sh --ci ${{ matrix.args }}
        name: install via cli.sh
      - run: ruby --version
        name: ruby --version via ${{ matrix.shell }}

  alpine:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    name: "alpine ${{ matrix.args || 'latest' }}"
    timeout-minutes: 10
    strategy:
      matrix:
        args: ['', '-v 3.3.13 -r 0']
      fail-fast: false
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - run: apk add --no-cache curl tar
      - uses: actions/checkout@v5
      - run: ./cli.sh --ci ${{ matrix.args }}
        name: install via cli.sh
      - run: ruby --version
        name: ruby --version

  windows:
    needs: releases
    if: needs.releases.outputs.published == 'true'
    name: "${{ matrix.os }} ${{ matrix.args || 'latest' }}"
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
        args: ['', '-v 3.4.12 -r 0']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: ./cli.sh --ci ${{ matrix.args }}
        name: install via cli.sh
        shell: bash
      - run: ruby.bat --version
        shell: bash
      - run: ruby --version
        shell: pwsh
      - run: ruby --version
        shell: cmd
